<!DOCTYPE html>
<html>
<head>

<title>OBB Editor</title>
<style>
body { margin:0; display:flex; height:100vh; background:#111; color:white; }
#view { flex:1; }
#panel {
  width:320px;
  background:#1e1e1e;
  padding:10px;
  font-family:monospace;
}

<script type="module" src="main.js"></script>
</body>
</html>
